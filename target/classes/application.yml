spring:
  datasource:
    url: jdbc:mysql://localhost:3306/keyworddb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: example
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  redis:
    host: localhost
    port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
app:
  remote:
    sample-url: https://raw.githubusercontent.com/CN1921/-/main/sample-data/keyword_stats_sample.json

