# ===== Server =====
server.port=8080

# ===== H2 Database (zero external dependency) =====
spring.datasource.url=jdbc:h2:mem:keyword_stock;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== H2 Console =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Jackson =====
spring.jackson.serialization.indent_output=true

# ===== App Config =====
app.remote.sample-url=https://raw.githubusercontent.com/CN1921/-/main/sample-data/keyword_stats_sample.json

# ===== AKShare Bridge =====
app.akshare.bridge-url=http://127.0.0.1:5555
app.akshare.auto-start=true
app.akshare.start-timeout-seconds=60
